name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: key_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d key_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/key_test
          DJANGO_DEBUG: 'True'
        run: python manage.py check
      - name: Migrate
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/key_test
          DJANGO_DEBUG: 'True'
        run: python manage.py migrate --noinput
      - name: Test
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/key_test
          DJANGO_DEBUG: 'True'
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
